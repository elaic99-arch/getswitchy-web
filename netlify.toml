# Switchy — static site. English is the default language and is served at the root;
# Hebrew lives under /he/… and French under /fr/…  (order everywhere: English, Hebrew, French).
# Every page address is a clean path: no .html, no file extension. Each file name that
# could be typed or was linked before redirects (301) to its clean address.
# The legal documents are Hebrew only, in every language: /terms (sellers' terms, then
# buyers' terms) and /privacy. The old /en/…, /he/… and /fr/… legal paths 301 to them.
# The /item/*, /profile/*, /p/*, /sitemap.xml edge functions are untouched.
[build]
  publish = "."
  command = ""

[build.processing.html]
  pretty_urls = false

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# ── home ──
[[redirects]]
from = "/"
to = "/index.en.html"
status = 200
force = true

[[redirects]]
