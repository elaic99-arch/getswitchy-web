# Switchy — version publique statique, FR / EN / HE.
# Publication depuis la racine du dépôt GitHub existant.
[build]
  publish = "."
  command = ""

[build.processing.html]
  pretty_urls = false

# Association du domaine aux applications : réglages existants conservés.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# URLs courtes et anciennes adresses compatibles.
# Netlify traite /page et /page/ comme une meme route.
# Ne pas ajouter de redirection entre ces deux formes : cela cree une boucle.
# Les regles status = 200 servent directement le fichier HTML correspondant.
# Les fonctions /item/*, /profile/*, /p/*, /sitemap.xml restent intactes.

[[redirects]]
from = "/"
to = "/en"
status = 302
force = true

[[redirects]]
from = "/assets/app-feed.webp"
to = "/assets/app-feed-ai.webp"
status = 301
force = true

[[redirects]]
from = "/assets/app-explore.webp"
to = "/assets/app-explore-ai-v29.svg"
status = 301
force = true

[[redirects]]
