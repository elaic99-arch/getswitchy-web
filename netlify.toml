# Switchy — version publique statique, FR / EN / HE.
# Publication depuis la racine du dépôt GitHub existant.
[build]
  publish = "."
  command = ""

[build.processing.html]
  pretty_urls = false

# Association du domaine aux applications : réglages existants conservés.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# Les trois fonctions existantes continuent de traiter /item/*,
# /profile/*, /p/* et /sitemap.xml. Aucun catch-all ne les masque.
[[redirects]]
  from = "/share/:id"
  to = "/item/:id"
  status = 301
  force = true

# Les liens /app des e-mails gardent une réponse HTML sur le même chemin.
# Les associations iOS/Android restent inchangées.
[[redirects]]
  from = "/app"
  to = "/application.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/application.html"
  status = 200

